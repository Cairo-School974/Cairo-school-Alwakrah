<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجدول الزمني وجداول الاختبارات</title>
    <!-- تأكد أن هذا الرابط يشير لملف الـ CSS الذي يحتوي على خلفية الموقع الموحدة -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* إجبار الصفحة على استخدام خلفية الموقع الموحدة */
        body {
            background: radial-gradient(circle at center, #1b263b, #0d1117) !important;
            color: #fff;
            font-family: 'Cairo', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            text-align: center;
            padding: 40px;
        }

        .main-form-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 50px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* تنسيق المربعات لتكون في صف واحد */
        .services-grid {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 20px;
            margin: 40px 0;
        }

        .service-card {
            flex: 1;
            padding: 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .service-card:hover {
            background: rgba(0, 180, 216, 0.2);
            border-color: #00b4d8;
            transform: translateY(-10px);
        }

        .service-card span {
            font-size: 40px;
            margin-bottom: 15px;
        }

        /* تنسيق زر العودة الموحد */
        .btn-modern-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            background: #007bff;
            color: #fff;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-modern-back:hover {
            background: #0056b3;
        }

        @media (max-width: 768px) {
            .services-grid {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-form-box">
            <h1>الجدول الزمني وجداول الاختبارات</h1>
            <p>اختر القسم المطلوب للانتقال إلى صفحته المستقلة وعرض بياناته بكل سهولة</p>

            <!-- القوائم الثلاثة في صف واحد -->
            <div class="services-grid">
                <a href="/exams_timeline/timeline" class="service-card">
                    <span>📅</span>
                    <h3>الجدول الزمني العام</h3>
                </a>
                <a href="/exams_timeline/evaluations" class="service-card">
                    <span>📝</span>
                    <h3>جداول اختبارات التقييمات</h3>
                </a>
                <a href="/exams_timeline/finals" class="service-card">
                    <span>🎓</span>
                    <h3>اختبارات نهاية الفصل</h3>
                </a>
            </div>

            <a href="/" class="btn-modern-back">⬅ العودة للرئيسية</a>
        </div>
    </div>

</body>
</html>
